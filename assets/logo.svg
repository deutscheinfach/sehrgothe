<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deutsch Einfach">
  <defs>
    <linearGradient id="deBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d5f"/>
      <stop offset="0.55" stop-color="#e11d33"/>
      <stop offset="1" stop-color="#b4142a"/>
    </linearGradient>
    <linearGradient id="deSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- الشكل الخارجي: مربع مدور بحال أيقونات التطبيقات -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#deBrand)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#deSheen)"/>

  <!-- حرف D مفتوح: كيقرا بحال كتاب محلول حتى هو -->
  <path d="M20 17h9.5c8.8 0 14.5 5.8 14.5 15s-5.7 15-14.5 15H20z"
        fill="none" stroke="#ffffff" stroke-width="5.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- الخط ديال النص فالوسط: القراءة -->
  <path d="M27.5 32h9" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".75"/>
</svg>
